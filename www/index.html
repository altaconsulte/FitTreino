<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="color-scheme" content="light dark">
  <title>FitTreino</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <button class="voltar" id="voltar" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="titulo">FitTreino</h1>
  </header>

  <main id="tela" tabindex="-1"></main>

  <nav class="abas" aria-label="Navegação principal">
    <a href="#/hoje" data-aba="hoje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Hoje</span>
    </a>
    <a href="#/treinos" data-aba="treinos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
      <span>Treinos</span>
    </a>
    <a href="#/historico" data-aba="historico">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>
      <span>Histórico</span>
    </a>
    <a href="#/dados" data-aba="dados">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      <span>Backup</span>
    </a>
  </nav>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <input type="file" id="arquivo" hidden>

  <script src="app.js"></script>
</body>
</html>
